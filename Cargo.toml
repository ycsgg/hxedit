[package]
name = "hxedit"
version = "0.4.0"
edition = "2021"
description = "A terminal hex editor optimized for large files"
license = "MIT OR Apache-2.0"
authors = ["ycsgg <ycs_gg@outlook.com>"]
repository = "https://github.com/ycsgg/hxedit"
homepage = "https://github.com/ycsgg/hxedit"
readme = "README.md"
keywords = ["hex", "editor", "tui", "binary", "terminal"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.94"
include = [
    "/src/**",
    "/examples/**",
    "/benches/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/README_CN.md",
    "/docs/**",
    "/LICENSE",
    "/licenses/**",
]

[features]
default = ["default-bundle"]
default-bundle = [
    "disasm-iced-x86",
    "disasm-yaxpeax-arm",
    "memory",
    "symbols",
    "scripting",
]
disasm = []
memory = []
symbols = ["disasm", "dep:object", "dep:symbolic-common", "dep:symbolic-demangle"]
scripting = ["dep:rhai"]
asm = ["disasm", "dep:keystone-engine"]
full = ["default-bundle", "asm", "sagitta-analysis"]
sagitta-analysis = ["symbols", "disasm", "dep:sagitta-rs"]
disasm-iced-x86 = ["disasm", "dep:iced-x86"]
disasm-yaxpeax-arm = ["disasm", "dep:yaxpeax-arch", "dep:yaxpeax-arm"]
remote-sftp = ["dep:ssh2"]
remote-ssh = []
remote-ftp = []
remote-all = ["remote-sftp", "remote-ssh", "remote-ftp"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.4"
crossterm = "0.28"
digest = "0.10"
directories = "6.0"
md-5 = "0.10"
memchr = "2.7"
ratatui = "0.29"
rhai = { version = "1.25.1", optional = true }
serde = { version = "1.0", features = ["derive"] }
sha1 = "0.10"
sha2 = "0.10"
supports-color = "3"
thiserror = "2.0"
toml = "1.1"
object = { version = "0.39", optional = true }
symbolic-common = { version = "12.18", optional = true }
symbolic-demangle = { version = "12.18", optional = true }
keystone-engine = { package = "hexpatch-keystone", version = "0.9.4", optional = true, features = ["build_keystone_cmake"] }
sagitta-rs = { version = "0.0.2", optional = true }
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "fast_fmt"], optional = true }
yaxpeax-arch = { version = "0.3", default-features = false, features = ["std"], optional = true }
yaxpeax-arm = { version = "0.4", default-features = false, features = ["std"], optional = true }
ssh2 = { version = "0.9", optional = true }

[dev-dependencies]
libc = "0.2"
pretty_assertions = "1.4"
tempfile = "3.14"

[[bench]]
name = "perf_bench"
harness = false

[profile.release]
lto = true
codegen-units = 1
